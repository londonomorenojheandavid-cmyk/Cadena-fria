<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FríoPesca</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header><b>🐟 FríoPesca · Gestión pesquera</b><form th:action="@{/logout}" method="post"><button>Salir</button></form></header><nav><a th:href="@{/}">Inicio</a><a th:href="@{/productos}">Productos</a><a th:href="@{/lotes}">Lotes</a><a th:href="@{/movimientos}">Ventas y mermas</a><a th:href="@{/temperaturas}">Cadena de frío</a><a th:href="@{/reportes}">Reportes</a></nav><main><p class="ok" th:if="${ok}" th:text="${ok}"></p><p class="error" th:if="${error}" th:text="${error}"></p><h1>Ventas y mermas</h1><section class="panel"><h2>Registrar salida de inventario</h2><form class="fields" th:action="@{/movimientos}" method="post"><label>Lote<select name="loteId" required><option th:each="l:${lotes}" th:value="${l.id}" th:text="${l.codigo+' · '+l.producto.nombre+' ('+l.kilosDisponibles+' kg)'}"></option></select></label><label>Tipo<select name="tipo"><option value="VENTA">Venta</option><option value="MERMA">Merma</option></select></label><label>Kilos<input name="kilos" type="number" step="0.01" min="0.01" required></label><label>Observación<input name="observacion"></label><button>Registrar</button></form></section><section class="panel scroll"><h2>Historial de movimientos</h2><table><tr><th>Fecha</th><th>Lote</th><th>Tipo</th><th>Kilos</th><th>Total COP</th><th>Observación</th></tr><tr th:each="x:${items}"><td th:text="${x.fecha}"></td><td th:text="${x.lote.codigo}"></td><td th:text="${x.tipo}"></td><td th:text="${x.kilos}"></td><td th:text="${x.total}"></td><td th:text="${x.observacion}"></td></tr></table></section></main></body></html>
