<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FríoPesca</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header><b>🐟 FríoPesca · Gestión pesquera</b><form th:action="@{/logout}" method="post"><button>Salir</button></form></header><nav><a th:href="@{/}">Inicio</a><a th:href="@{/productos}">Productos</a><a th:href="@{/lotes}">Lotes</a><a th:href="@{/movimientos}">Ventas y mermas</a><a th:href="@{/temperaturas}">Cadena de frío</a><a th:href="@{/reportes}">Reportes</a></nav><main><p class="ok" th:if="${ok}" th:text="${ok}"></p><p class="error" th:if="${error}" th:text="${error}"></p><h1>Productos</h1><section class="panel"><h2>Registrar producto</h2><form class="fields" th:action="@{/productos}" method="post"><label>Nombre<input name="nombre" placeholder="Bocachico" required maxlength="255"></label><label>Especie<input name="especie" placeholder="Prochilodus magdalenae" required maxlength="255"></label><label>Precio por kg (COP)<input type="number" name="precioKg" placeholder="15000" step="0.01" min="0.01" required></label><button>Guardar</button></form></section><section class="panel scroll"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:12px"><h2 style="margin:0">Catálogo</h2><form class="fields" th:action="@{/productos}" method="get"><input name="q" th:value="${q}" placeholder="Buscar por nombre o especie..."><button type="submit">Buscar</button></form></div><table><tr><th>ID</th><th>Nombre</th><th>Especie</th><th>Precio/kg</th><th>Estado</th><th>Acción</th></tr><tr th:each="p:${items}"><td th:text="${p.id}"></td><td th:text="${p.nombre}"></td><td th:text="${p.especie}"></td><td th:text="${p.precioKg}"></td><td th:text="${p.activo?'Activo':'Inactivo'}"></td><td><form th:if="${p.activo}" th:action="@{/productos/{id}/desactivar(id=${p.id})}" method="post"><button class="danger">Desactivar</button></form></td></tr></table></section></main></body></html>
