<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FríoPesca</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header><b>🐟 FríoPesca · Gestión pesquera</b><form th:action="@{/logout}" method="post"><button>Salir</button></form></header><nav><a th:href="@{/}">Inicio</a><a th:href="@{/productos}">Productos</a><a th:href="@{/lotes}">Lotes</a><a th:href="@{/movimientos}">Ventas y mermas</a><a th:href="@{/temperaturas}">Cadena de frío</a><a th:href="@{/reportes}">Reportes</a></nav><main><p class="ok" th:if="${ok}" th:text="${ok}"></p><p class="error" th:if="${error}" th:text="${error}"></p><h1>Control de cadena de frío</h1><section class="panel"><h2>Registrar lectura manual</h2><form class="fields" th:action="@{/temperaturas}" method="post"><label>Lote<select name="loteId" required><option th:each="l:${lotes}" th:value="${l.id}" th:text="${l.codigo+' · '+l.ubicacion}"></option></select></label><label>Temperatura °C<input name="temperatura" type="number" step="0.1" min="-100" max="100" required></label><label>Responsable<input name="responsable" required></label><label>Observación<input name="observacion"></label><button>Guardar lectura</button></form></section><section class="panel scroll"><h2>Historial de mediciones</h2><table><tr><th>Fecha</th><th>Lote</th><th>°C</th><th>Responsable</th><th>Estado</th><th>Observación</th></tr><tr th:each="x:${items}"><td th:text="${x.fecha}"></td><td th:text="${x.lote.codigo}"></td><td th:text="${x.temperatura}"></td><td th:text="${x.responsable}"></td><td th:classappend="${x.alerta}?'alerta':''" th:text="${x.alerta}?'FUERA DE RANGO':'Normal'"></td><td th:text="${x.observacion}"></td></tr></table></section></main></body></html>
