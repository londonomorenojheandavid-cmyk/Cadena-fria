<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FríoPesca</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header><b>🐟 FríoPesca · Gestión pesquera</b><form th:action="@{/logout}" method="post"><button>Salir</button></form></header><nav><a th:href="@{/}">Inicio</a><a th:href="@{/productos}">Productos</a><a th:href="@{/lotes}">Lotes</a><a th:href="@{/movimientos}">Ventas y mermas</a><a th:href="@{/temperaturas}">Cadena de frío</a><a th:href="@{/reportes}">Reportes</a></nav><main><p class="ok" th:if="${ok}" th:text="${ok}"></p><p class="error" th:if="${error}" th:text="${error}"></p><h1>Reportes operativos</h1><p><button onclick="window.print()">Imprimir / Guardar PDF</button></p><section class="panel scroll"><h2>Existencias por lote</h2><table><tr><th>Lote</th><th>Producto</th><th>Kg disponibles</th><th>Vencimiento</th></tr><tr th:each="x:${lotes}"><td th:text="${x.codigo}"></td><td th:text="${x.producto.nombre}"></td><td th:text="${x.kilosDisponibles}"></td><td th:text="${x.fechaVencimiento}"></td></tr></table></section><section class="panel scroll"><h2>Movimientos</h2><table><tr><th>Fecha</th><th>Lote</th><th>Tipo</th><th>Kg</th><th>Valor</th></tr><tr th:each="x:${movimientos}"><td th:text="${x.fecha}"></td><td th:text="${x.lote.codigo}"></td><td th:text="${x.tipo}"></td><td th:text="${x.kilos}"></td><td th:text="${x.total}"></td></tr></table></section><section class="panel scroll"><h2>Temperaturas</h2><table><tr><th>Fecha</th><th>Lote</th><th>°C</th><th>Alerta</th></tr><tr th:each="x:${lecturas}"><td th:text="${x.fecha}"></td><td th:text="${x.lote.codigo}"></td><td th:text="${x.temperatura}"></td><td th:text="${x.alerta?'Sí':'No'}"></td></tr></table></section></main></body></html>
