name: CI Java
on:
  push:
    branches: [main, develop, "feature/**", "hotfix/**", "release/**"]
  pull_request:
    branches: [develop, main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      - name: Compilar y ejecutar pruebas unitarias
        run: mvn test -B
